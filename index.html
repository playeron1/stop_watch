<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean stopwatch interface">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stopwatch" aria-labelledby="page-title">
    <h1 id="page-title">Stopwatch</h1>

    <section class="timer-panel" aria-label="Stopwatch display">
      <div class="timer" aria-label="00 hours, 00 minutes, 00 seconds, 00 hundredths">
        <span class="timer__group">
          <span class="timer__value">00</span>
          <span class="timer__label">hours</span>
        </span>
        <span class="timer__separator" aria-hidden="true">:</span>
        <span class="timer__group">
          <span class="timer__value">00</span>
          <span class="timer__label">minutes</span>
        </span>
        <span class="timer__separator" aria-hidden="true">:</span>
        <span class="timer__group">
          <span class="timer__value">00</span>
          <span class="timer__label">seconds</span>
        </span>
        <span class="timer__separator timer__separator--small" aria-hidden="true">.</span>
        <span class="timer__group timer__group--small">
          <span class="timer__value">00</span>
          <span class="timer__label">hundredths</span>
        </span>
      </div>
    </section>

    <nav class="controls" aria-label="Stopwatch controls">
      <button id="start" class="button button--primary" type="button">Start</button>
      <button id="stop" class="button button--secondary" type="button">Stop</button>
      <button id="reset" class="button button--quiet" type="button">Reset</button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
